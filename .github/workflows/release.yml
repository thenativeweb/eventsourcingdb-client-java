name: Release

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Use Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: '21'
    - name: Use Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
    - name: Run QA
      run: make qa
    - name: Get next version
      id: get_next_version
      uses: thenativeweb/get-next-version@2.8.1
    - name: Create new version
      if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
      run: |
        git tag v${{steps.get_next_version.outputs.version}}
        git push origin v${{steps.get_next_version.outputs.version}}
    # Uploads the new version to Maven Central without releasing it, so that
    # it is checked in the Central Portal and released there by hand. What is
    # released on Maven Central can never be removed again.
    - name: Publish new version
      if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.TOKEN_GITHUB_TO_MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.TOKEN_GITHUB_TO_MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.KEY_GITHUB_TO_MAVEN_CENTRAL_SIGNING }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.KEY_GITHUB_TO_MAVEN_CENTRAL_SIGNING_PASSWORD }}
      run: |
        ./gradlew publishToMavenCentral -Pversion=${{ steps.get_next_version.outputs.version }}
